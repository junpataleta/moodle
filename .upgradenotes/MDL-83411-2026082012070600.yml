issueNumber: MDL-83411
notes:
  core:
    - message: >-
        The tc-lib-pdf library has been added, and is now the preferred library
        for generating PDF documents. The new `\core\pdf\document` class wraps
        it with the Moodle defaults for language, metadata, fonts and local file
        access, and emits tagged PDF/UA output by default so that generated
        documents are accessible to assistive technology.
      type: improved
    - message: >-
        The `\pdf` class in `lib/pdflib.php`, which wraps TCPDF, is now
        discouraged for new code because TCPDF cannot produce tagged output. It
        is unchanged and continues to be supported, so existing code and plugins
        that extend it keep working. Whether TCPDF is eventually removed is
        being tracked separately.
      type: changed
    - message: >-
        Sites that added their own fonts for PDF export must convert them again.
        The new library cannot read fonts prepared for TCPDF, so a report
        exported as PDF will silently fall back to the default font, which for a
        script the default does not cover means missing text. Convert each font
        again from its original .ttf or .otf with
        `php bin/moodle admin:pdf-font:convert /path/to/font.ttf`. The files
        already in place are still used by PDF annotation and by Brickfield, so
        leave them where they are. See
        https://docs.moodle.org/en/Add_fonts_for_embedding
      type: changed
  dataformat_pdf:
    - message: >-
        Reports exported as PDF are now tagged, so that assistive technology
        can read them as tables. The font is taken from the `PDF_DEFAULT_FONT`
        constant when a site has set it, as before, and otherwise from the
        first available font in `$CFG->pdfexportfont`. A tagged export needs
        more memory than before, so a very large export is now rendered as
        several tables, and stops with a message when it would run out of
        memory. Raise `$CFG->extramemorylimit` to allow larger exports.
      type: changed
