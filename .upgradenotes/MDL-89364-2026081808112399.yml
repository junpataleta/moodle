issueNumber: MDL-89364
notes:
  core:
    - message: >-
        Components can now contribute their own data to the site registration
        payload sent to the Moodle sites directory, via three new hooks in
        `\core\hook\hub`: 
        * `site_registration_data`, dispatched from
        `\core\hub\registration::get_site_info()`, to add values to the payload;
        * `site_registration_summary`, dispatched from
        `\core\hub\registration::get_stats_summary()`, to describe those values
        on the admin confirmation screen; and 
        * `site_registration_new_fields`,
        dispatched from `\core\hub\registration::get_new_registration_fields()`,
        to flag which of the component's fields are new since the site's
        registration was last confirmed.
      type: improved
